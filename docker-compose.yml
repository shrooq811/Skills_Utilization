services:
  web:
    image: ghcr.io/shrooq811/skills_utilization:latest
    build:
      context: ./Skills_Utilization
      dockerfile: ./Dockerfile
    container_name: skills_app_backend_frontend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:secure_password_99@postgres:5432/app_db
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    container_name: skills_postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secure_password_99
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  vault:
    image: hashicorp/vault:1.17
    container_name: hashicorp_vault_v1.17
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=myroottoken
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    cap_add:
      - IPC_LOCK

volumes:
  postgres_data:
