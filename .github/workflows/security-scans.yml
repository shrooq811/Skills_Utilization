name: Security Scans Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security-scans:
    runs-on-ubuntu: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Create reports directory
        run: mkdir -p security-reports

      - name: Run TruffleHog Scan
        uses: trufflehog/trufflehog-action@main
        continue-on-error: true
        with:
          path: ./
          base: ""
          head: HEAD
          extra_args: --no-update --json > security-reports/trufflehog-report.json

      - name: Run Hadolint Scan
        uses: hadolint/hadolint-action@v3.1.0
        continue-on-error: true
        with:
          dockerfile: Dockerfile
          format: json
          output-file: security-reports/hadolint-report.json

      - name: Run Bandit Scan
        continue-on-error: true
        run: |
          pip install bandit
          bandit -r . -f json -o security-reports/bandit-report.json || true

      - name: Commit and push reports to GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: automated security scan reports update"
          file_pattern: security-reports/*.json
          branch: main
